<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Wars Monopoly Global Survival</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>⭐ Star Wars Monopoly Global Survival ⭐</h1>
    <h2>Classic Trilogy Edition</h2>

    <div id="turnDisplay">
        Turn: <span id="turnNumber">1</span>
        <button onclick="endTurn()">END TURN</button>
    </div>
</header>


<main>


<!-- GRAPH SECTION -->
<section class="panel graph-panel">

    <h2>📈 Player Value History</h2>

    <canvas id="valueGraph"></canvas>

</section>



<!-- PLAYER SECTION -->
<section class="panel">

    <h2>👥 Players</h2>

    <button onclick="addPlayer()">
        Add Player
    </button>

    <div id="playersContainer">

        <!-- Players appear here -->

    </div>

</section>




<!-- PLAYER CONTROLS -->
<section class="panel">

<h2>💰 Economy Controls</h2>


<select id="selectedPlayer">
    <option>Select Player</option>
</select>


<br><br>


<input 
type="number"
id="amountInput"
placeholder="Amount">


<br><br>


<button onclick="giveMoney()">
Give Money
</button>


<button onclick="removeMoney()">
Remove Money
</button>



<h3>💳 Debt</h3>


<button onclick="addDebt()">
Add Debt
</button>


<button onclick="removeDebt()">
Remove Debt
</button>


<button onclick="forgiveDebt()">
Forgive Debt %
</button>


</section>






<!-- LOAN SECTION -->
<section class="panel">

<h2>🏦 Loans</h2>


<select id="loanPlayer">
<option>Select Player</option>
</select>


<br><br>


<input 
type="number"
id="loanAmount"
placeholder="Loan Amount">


<br><br>


<input 
type="number"
id="interestRate"
placeholder="Interest %">


<br><br>


<button onclick="takeLoan()">
Take Loan
</button>


<button onclick="payLoan()">
Pay Loan
</button>


<div id="loanList">

</div>


</section>






<!-- PROPERTY SECTION -->
<section class="panel">

<h2>🏠 Properties</h2>


<input 
id="propertySearch"
placeholder="Search properties">


<div id="propertyContainer">

<!-- Properties appear here -->

</div>


</section>







<!-- PROPERTY ACTIONS -->

<section class="panel">

<h2>🏷 Property Actions</h2>


<select id="propertySelect">

<option>Select Property</option>

</select>


<br><br>


<select id="propertyOwner">

<option>Select Player</option>

</select>


<br><br>


<button onclick="giveProperty()">
Give Property
</button>


<button onclick="mortgageProperty()">
Mortgage
</button>


<button onclick="removeMortgage()">
Remove Mortgage
</button>


<button onclick="liquidateProperty()">
Liquidate
</button>


<button onclick="auctionProperty()">
Auction
</button>


</section>






<!-- SPECIAL EVENTS -->

<section class="panel">

<h2>🎲 Event Tools</h2>


<button onclick="spawnPoland()">
🇵🇱 Spawn Poland
</button>


<button onclick="removePoland()">
Remove Poland
</button>


<button onclick="randomPlayer()">
Random Player
</button>


<button onclick="showEventLog()">
Event Log
</button>


</section>







<!-- GAME LOG -->

<section class="panel">

<h2>📜 Game History</h2>


<div id="eventLog">

No events yet.

</div>


</section>





<!-- SAVE SYSTEM -->

<section class="panel">

<h2>💾 Save</h2>


<button onclick="saveGame()">
Save Game
</button>


<button onclick="loadGame()">
Load Game
</button>


<button onclick="exportGame()">
Export Save
</button>


</section>



</main>


<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="properties.js"></script>
<script src="script.js"></script>


</body>
</html>
